<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Project Dashboard</title>
  <meta name="theme-color" content="#0b0c14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=s1">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <h1><a href="#" class="home-link">Project Dashboard</a></h1>
      <p class="hello" id="hello"></p>
      <div class="top-actions">
        <button class="top-btn session-start" id="session-btn" type="button" hidden>Start session</button>
        <button class="top-btn solid" id="new-task" type="button">New task</button>
        <button class="top-btn" id="new-project" type="button">New project</button>
        <button class="top-btn" id="refresh" type="button">Refresh</button>
      </div>
    </div>
    <nav class="tabs" aria-label="Views">
      <a href="#" data-view="home">Dashboard</a>
      <a href="#tasks" data-view="tasks">All tasks</a>
      <a href="#hours" data-view="hours">Hours</a>
      <a href="#log" data-view="log">Log</a>
    </nav>
  </header>
  <div class="session-bar" id="session-bar" hidden></div>

  <main id="app" class="layout">
    <section class="next" id="next-section" aria-labelledby="next-title">
      <button class="strip" id="strip-left" type="button" aria-label="Show Up next">Up next</button>
      <div class="next-head">
        <h2 id="next-title">Up next for you</h2>
        <button class="fold-btn" id="next-fold" type="button" aria-expanded="true" aria-controls="next-list" aria-label="Collapse Up next">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <ol class="next-list" id="next-list"></ol>
    </section>

    <div class="divider" id="divider" role="group" aria-label="Resize panels">
      <button type="button" class="push" id="push-left" aria-label="Collapse Up next, widen the right side">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="push" id="push-right" aria-label="Widen Up next, collapse the right side">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <button class="strip strip-right" id="strip-right" type="button" aria-label="Show projects">Projects</button>

    <section class="view" id="view-home" aria-labelledby="projects-title">
      <div class="projects-head">
        <h2 id="projects-title">Projects</h2>
        <label class="closed-toggle"><input type="checkbox" id="show-closed"> Show done and canceled</label>
      </div>
      <div class="chips" id="client-chips" role="group" aria-label="Filter by client"></div>
      <div id="project-groups"></div>
    </section>

    <section class="view" id="view-tasks" aria-labelledby="tasks-title" hidden>
      <div class="projects-head">
        <h2 id="tasks-title">All tasks</h2>
        <label class="switch"><input type="checkbox" id="ticketing"> Ticketing mode</label>
      </div>
      <div class="filters" id="task-filters"></div>
      <div class="table-wrap" id="task-table"></div>
    </section>

    <section class="view" id="view-hours" aria-labelledby="hours-title" hidden></section>

    <section class="view" id="view-log" aria-labelledby="log-title" hidden>
      <div class="projects-head"><h2 id="log-title">Log</h2></div>
      <div class="filters" id="log-filters"></div>
      <div id="log-list"></div>
    </section>

    <section class="view" id="view-project" aria-live="polite" hidden></section>
  </main>

  <div class="gate" id="gate" hidden>
    <form id="gate-form" class="gate-card">
      <h2>Open your dashboard</h2>
      <p>Paste the key from your dashboard link. It stays on this device only.</p>
      <input id="gate-key" type="password" autocomplete="off" placeholder="Your key" required>
      <button type="submit">Open dashboard</button>
      <p class="gate-error" id="gate-error" role="alert"></p>
    </form>
  </div>

  <dialog id="dialog" class="dialog"></dialog>

  <p class="status-line" id="status-line" role="status"></p>
  <script src="app.js?v=s1"></script>
</body>
</html>
